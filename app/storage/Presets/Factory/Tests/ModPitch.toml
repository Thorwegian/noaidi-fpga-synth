format = 1

[voice]
structure = "1+1"
osc_mix = 0
unison_detune = 0
unison_stereo = 0

[[osc]]
wave = "saw"
tune = -0.1
pulse_width = 50

[[osc]]
wave = "saw"
tune = 0.1
pulse_width = 50

[filter]
type = "lowpass"
slope = 24
cutoff = 2000
resonance = 1
key_track = 100

[amp_env]
attack = 0.3
sustain = 0
decay = 1
release = 0.5
velocity = 0

[mod_env]
attack = 1
sustain = 100
decay = 1
release = 0.5
velocity = 0
depth = 0
pitch = 12

[[lfo]]
shape = "triangle"
rate = 1
destination = "pitch"
depth = 0

[[lfo]]
shape = "triangle"
rate = 1
destination = "pitch"
depth = 0

[part]
volume = 0
pan = 0
bend_range = 2
# end
