format = 1

[voice]
structure = "1+1"
osc_mix = -100
unison_detune = 0
unison_stereo = 0

[[osc]]
wave = "saw"
tune = 0
pulse_width = 50

[[osc]]
wave = "saw"
tune = 0
pulse_width = 50

[filter]
type = "lowpass"
slope = 24
cutoff = 14388
resonance = 0.7
key_track = 0

[amp_env]
attack = 0
sustain = 0
decay = 0.59
release = 0.009
velocity = 0

[mod_env]
attack = 0
sustain = 100
decay = 0.59
release = 0.009
velocity = 0
depth = 0
pitch = 0

[[lfo]]
shape = "triangle"
rate = 1
destination = "pitch"
depth = 0

[[lfo]]
shape = "triangle"
rate = 1
destination = "pulse_width"
depth = 0

[part]
volume = 0
pan = 0
bend_range = 2
