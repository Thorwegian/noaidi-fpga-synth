format = 1

[voice]
structure = "1+1"
osc_mix = 0
unison_detune = 0
unison_stereo = 0

[[osc]]
wave = "saw"
tune = 0
pulse_width = 50

[[osc]]
wave = "saw"
tune = 0.07
pulse_width = 50

[filter]
type = "lowpass"
slope = 24
cutoff = 300
resonance = 0.9
key_track = 100

[amp_env]
attack = 0.03
sustain = 0
decay = 1
release = 0.35
velocity = 30

[mod_env]
attack = 0.12
sustain = 45
decay = 0.9
release = 0.4
velocity = 40
destination = "cutoff"
depth = 36

[[lfo]]
shape = "triangle"
rate = 5
destination = "pitch"
depth = 0

[[lfo]]
shape = "triangle"
rate = 1
destination = "pulse_width"
depth = 0

[part]
volume = 0
pan = 0
bend_range = 2
# end
