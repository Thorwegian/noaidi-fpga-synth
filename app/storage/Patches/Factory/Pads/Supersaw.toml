# The startup sound: a 7+1 supersaw with a sine an octave below.
format = 1

[voice]
structure = "7+1"
osc_mix = 0
unison_detune = 0.07
unison_stereo = 100

[[osc]]
wave = "saw"
tune = 0
pulse_width = 50

[[osc]]
wave = "sine"
tune = -12
pulse_width = 50

[filter]
type = "lowpass"
slope = 24
cutoff = 261.6
resonance = 1
key_track = 100

[amp_env]
attack = 0.042
sustain = -3.76
decay = 3
release = 11
velocity = 61.4

[mod_env]
attack = 0.0417
sustain = 93.75
decay = 3
release = 25.15
velocity = 100
destination = "cutoff"
depth = 24

[[lfo]]
shape = "triangle"
rate = 1
destination = "pitch"
depth = 0.094

[[lfo]]
shape = "triangle"
rate = 1
destination = "pulse_width"
depth = 0

[part]
volume = 0
pan = 0
bend_range = 2
